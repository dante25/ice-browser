<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Opasna stranica</title>
<style>
:root{--bg:#fff;--fg:#1d1d1f;--muted:#5c5c66;--accent:#b3261e;--btn:#1d1d1f;--btnfg:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#ececf1;--muted:#a1a1aa;--accent:#f2827a;--btn:#ececf1;--btnfg:#18181b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 system-ui,sans-serif}
main{max-width:560px;margin:14vh auto 0;padding:0 24px}
h1{font-size:26px;margin:0 0 6px;color:var(--accent)}
#host{font-family:ui-monospace,monospace;color:var(--muted);margin:0 0 20px;word-break:break-all}
.row{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:28px}
button{font:inherit;border:0;cursor:pointer}
#back{background:var(--btn);color:var(--btnfg);padding:10px 18px;border-radius:8px;font-weight:600}
#go{background:none;color:var(--muted);font-size:14px;text-decoration:underline;padding:0}
#source{color:var(--muted);font-size:14px;margin:0}
#source a{color:inherit}
</style>
</head>
<body>
<main>
  <h1>Opasna stranica</h1>
  <p id="host"></p>
  <p id="text"></p>
  <p id="source"></p>
  <div class="row">
    <button id="back">Nazad na sigurno</button>
    <button id="go">Ipak otvori (ne preporučuje se)</button>
  </div>
</main>
<script src="warning.js"></script>
</body>
</html>
