<!doctype html>
<html lang="bs">
<head>
<meta charset="utf-8">
<title>Novi tab</title>
<link rel="stylesheet" href="ice.css">
<style>
body{background:var(--base);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
@media (prefers-color-scheme:dark){body{background:#232323}}
.logo{display:flex;align-items:center;gap:14px;font-size:40px;font-weight:300;letter-spacing:.05em}
.logo img{width:56px;height:56px;border-radius:12px}
form{width:min(620px,90vw)}
form input.search{height:50px;border-radius:25px;font-size:16px;padding-left:46px;background-position:17px 50%;background-color:var(--panel)}
.tiles{display:grid;grid-template-columns:repeat(4,108px);gap:14px}
.tile{height:96px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--text);text-decoration:none;padding:8px}
.tile:hover{background:var(--accent);color:var(--on-accent)}
.tile img{width:28px;height:28px}
.tile span{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="logo"><img src="icons/ice-128.png" alt="">ice</div>
<form id="f"><input class="search" id="q" placeholder="Pretraži ili upiši adresu" autofocus autocomplete="off"></form>
<div class="tiles" id="tiles"></div>
<script src="newtab.js"></script>
</body>
</html>
