<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Video Sniffer – stream download</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    button { font: inherit; padding: 6px 12px; margin: 2px 4px 2px 0; cursor: pointer; }
    #url { word-break: break-all; opacity: .7; font-size: 12px; }
    progress { width: 100%; height: 16px; }
  </style>
</head>
<body>
  <h2>Stream download</h2>
  <p id="url"></p>
  <div id="variants"></div>
  <p id="status">Loading playlist…</p>
  <div id="controls" hidden>
    <button id="start">Choose file &amp; download</button>
    <button id="cancel" hidden>Cancel</button>
  </div>
  <progress id="bar" value="0" max="1" hidden></progress>
  <script src="hls.js"></script>
  <script src="mp4merge.js"></script>
  <script src="downloader.js"></script>
</body>
</html>
