<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta charset="utf-8">
  <title>Popup :: Permanent Progress Bar for YouTube</title>
  <link rel="stylesheet" type="text/css" href="index.css">
  <link rel="icon" type="image/png" href="/data/icons/48.png">
</head>
<body>
  <h1>Permanent Progress Bar for YouTube</h1>
  <div class="tbl">
    <label for="top">Display permanent progress bar</label>
    <input type="checkbox" id="top"/>
    <label for="embed">Display permanent progress bar (embedded)</label>
    <input type="checkbox" id="embed"/>
    <label for="hide">Temporary hide the permanent progress bar</label>
    <input type="checkbox" id="hide"/>
  </div>
  <p>
  </p>
  <footer>
    <input type="button" id="youtube" value="YouTube">
    <input type="button" id="faqs" value="FAQs Page">
    <input type="button" id="options" value="Options Page">
  </footer>
  <script src="index.js"></script>
</body>
</html>
